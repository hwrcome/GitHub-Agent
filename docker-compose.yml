x-app-environment: &app_environment
  DATABASE_URL: postgresql+asyncpg://github_agent:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/github_agent
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-1800}
  AGENT_MODE: ${AGENT_MODE:-mock}
  MCP_SERVER_SCRIPT: ${MCP_SERVER_SCRIPT:-}
  MCP_SERVER_PYTHON: ${MCP_SERVER_PYTHON:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: github_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: github_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github_agent -d github_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  api:
    build: .
    environment:
      <<: *app_environment
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO", "--pool=solo"]
    environment:
      <<: *app_environment
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
