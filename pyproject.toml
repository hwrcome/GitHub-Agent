[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-agent-backend"
version = "0.1.0"
description = "Backend service wrapper for the GitHub recommendation Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "celery[redis]>=5.4,<6.0",
    "PyJWT>=2.9,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "fakeredis>=2.26,<3.0",
]
load = ["locust>=2.32,<3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires PostgreSQL and Redis services",
]

[tool.setuptools.packages.find]
include = ["app*"]
